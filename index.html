<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini-Terrarium">
<meta name="theme-color" content="#2a2330">
<title>Mini-Terrarium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Grundeinstellungen für die eigenständige Seite */
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
</style>
<style>
/* Layout: Vollbild-Canvas als Terrarium, HUD oben und Hinweis unten als Holztafeln */
:root{
  --nacht:#1b2433; --holz:#5b3a21; --papier:#fff1d6; --tinte:#3b2414; --gold:#e0a21b; --gras:#4a9a55; --rot:#b8442f; --satt:#d98a1e; --sauber:#3d8fb8; --wach:#4a9a55; --froh:#c4517a;
  --pixel:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--nacht);color:var(--tinte);font-family:var(--pixel);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated;display:block}
.tafel{border:12px solid transparent;border-image:var(--ui1) 10 fill / 12px stretch;image-rendering:pixelated;color:var(--tinte)}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 0;display:flex;gap:4px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.chip{border:7px solid transparent;border-image:var(--ui1) 10 fill / 7px stretch;display:flex;align-items:baseline;gap:4px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;background:none;padding:0 1px}
.chip small{font-size:10px;font-weight:400;letter-spacing:.03em;text-transform:uppercase;opacity:.75}
.chip small:empty{display:none}
.muenze{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 1px var(--holz);align-self:center}
#hud > *{pointer-events:auto}
.wert{display:flex;align-items:baseline;gap:6px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px;white-space:nowrap}
.wert small{font-size:12px;font-weight:400;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
button{font:inherit;color:inherit;cursor:pointer}
#uhr:focus-visible,.knopf:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hinweis{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);margin:0 auto;max-width:380px;display:block;white-space:normal;text-align:center;font-size:12px;font-weight:400;line-height:1.3;pointer-events:none;transition:opacity .4s}
#hinweis.aus{opacity:0}
.pfeil{background:none;border:0;font-size:15px;line-height:1;padding:0 6px;font-weight:600}
.pfeil:focus-visible{outline:3px solid var(--gold)}
#status{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 40px);display:grid;gap:4px;font-size:12px;font-weight:400;white-space:normal}
#bogen{display:grid;gap:4px;width:150px}
#status header{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
#status header small{font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.zeile{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:5px}
  .balken{height:7px;background:var(--holz);padding:2px}
.balken i{display:block;height:100%;width:50%;background:var(--farbe)}
.balken.knapp i{background:var(--rot)}
#werte{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:2px;border-top:2px solid var(--holz);padding-top:4px}
#werte small{display:block;font-size:9px;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
#werte b{font-size:13px;font-variant-numeric:tabular-nums}
#gedanke{font-size:11px;line-height:1.3;font-style:italic;margin-top:4px}
#gedanke:empty{display:none}
#art{background:none;border:0;padding:0;text-align:left;font-weight:600}
#karr:empty{display:none}
#aTag{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 40px)}
#aKlinik{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);color:var(--rot)}
#aTag.fertig{filter:brightness(1.08) saturate(1.3)}
.posten.ohne{grid-template-columns:1fr}
.posten .erledigt{color:var(--gras);font-weight:600}
#lage,#freunde,#art,#karr{font-size:11px;line-height:1.3;margin-top:4px}
#klapp{background:none;border:0;padding:0 2px;font-size:13px;font-weight:600;white-space:nowrap}
#klapp.knapp{color:var(--rot)}
#klapp:focus-visible{outline:3px solid var(--gold)}
#blatt{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,22,.55)}
#blatt .tafel{width:min(340px,100%);max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
#blatt h2{margin:0;font-size:24px;font-weight:600}
#blatt p{margin:0;font-size:14px;line-height:1.35}
.posten{margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-top:2px solid var(--holz);padding-top:8px}
.posten b{font-size:16px}
.posten span{font-size:13px;line-height:1.3;grid-column:1}
.posten .knopf{grid-column:2;grid-row:1 / span 2;flex:none;min-width:84px;font-size:14px}
.posten .fehlt{font-weight:600}
#aktionen{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;gap:4px;justify-content:center}
#aktionen .knopf{flex:1 1 0;max-width:104px;min-width:0;font-size:12px;padding:1px 0;border-width:7px;border-image-width:7px}
#aktionen .knopf.aktiv{filter:brightness(1.35)}
#dialog{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,22,.55)}
#dialog .tafel{width:min(320px,100%);display:flex;flex-direction:column;gap:10px;padding:6px}
#dialog h2{margin:0;font-size:24px;font-weight:600;text-wrap:balance}
#dialog p{margin:0;font-size:15px;line-height:1.35}
#dialog dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:16px}
#dialog dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.fehlt{color:var(--rot)}
.reihe{display:flex;gap:8px;margin-top:4px}
.knopf{flex:1;border:10px solid transparent;border-image:var(--ui2) 10 fill / 10px stretch;image-rendering:pixelated;color:var(--papier);font-size:16px;font-weight:600;padding:4px 6px;background:none}
.knopf:disabled{opacity:.45;cursor:default}
#hud{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#status{left:max(16px,env(safe-area-inset-left,0px))}
/* Querformat auf dem Handy: Knöpfe als Spalte rechts, damit unten nichts die Welt verdeckt */
@media (orientation:landscape) and (max-height:520px){
  #aktionen{left:auto;top:0;bottom:0;flex-direction:column;justify-content:center;padding:36px max(16px,env(safe-area-inset-right,0px)) 0 0}
  #aktionen .knopf{flex:none;width:84px;max-width:none}
  #hinweis{bottom:calc(env(safe-area-inset-bottom,0px) + 6px);right:120px;left:max(16px,env(safe-area-inset-left,0px));max-width:420px}
  #bogen{grid-template-columns:1fr;max-height:calc(100vh - 110px);overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){#hinweis{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Terrarium mit deinem Mini"></canvas>
<div id="hud">
  <button id="uhr" class="tafel chip" title="Tageszeit testen"><span id="zeit">--:--</span><small id="phase"></small></button>
  <div class="tafel chip"><small>St</small><span id="stufe">1</span><small id="ep">0/30</small></div>
  <div class="tafel chip"><i class="muenze"></i><span id="geld">0</span></div>
  <button id="aMinis" class="tafel chip"><small>Minis</small><span id="anzahl">1/2</span></button>
</div>
<div id="status" class="tafel chip">
  <header><button id="vor" class="pfeil" aria-label="Vorheriger Mini">‹</button><button id="klapp" aria-expanded="false" aria-controls="bogen"><span id="sName">Mika</span> <span id="klappPfeil">▸</span></button><button id="nach" class="pfeil" aria-label="Nächster Mini">›</button></header>
  <div id="bogen" hidden>
    <div class="zeile"><span>Hunger</span><div class="balken" id="bH" style="--farbe:var(--satt)"><i></i></div></div>
    <div class="zeile"><span>Sauber</span><div class="balken" id="bS" style="--farbe:var(--sauber)"><i></i></div></div>
    <div class="zeile"><span>Energie</span><div class="balken" id="bE" style="--farbe:var(--wach)"><i></i></div></div>
    <div class="zeile"><span>Laune</span><div class="balken" id="bL" style="--farbe:var(--froh)"><i></i></div></div>
    <div id="werte"></div>
    <button id="art"></button>
    <div id="karr"></div>
    <div id="lage"></div>
    <div id="gedanke"></div>
    <div id="freunde"></div>
  </div>
</div>
<button id="aTag" class="tafel chip"><small>Tag</small><span id="tagStand">0/3</span><small id="serie"></small></button>
<button id="aKlinik" class="tafel chip" hidden><small>Klinik</small><span id="klinikZahl">1</span></button>
<div id="hinweis" class="tafel chip">Tippe auf den Boden, dann läuft dein Mini dorthin. Wische, um dich umzusehen, und zoome mit zwei Fingern. Tippe einen Mini an, um ihn auszuwählen.</div>
<div id="aktionen">
  <button class="knopf" id="aFutter">Essen</button>
  <button class="knopf" id="aWasch">Waschen</button>
  <button class="knopf" id="aSchlaf">Schlafen</button>
  <button class="knopf" id="aArbeit">Arbeit</button>
</div>
<div id="blatt" hidden>
  <div class="tafel" role="dialog" aria-labelledby="bTitel">
    <h2 id="bTitel"></h2>
    <p id="bText"></p>
    <div id="bListe"></div>
    <div class="reihe"><button class="knopf" id="bZu">Schließen</button></div>
  </div>
</div>
<div id="dialog" hidden>
  <div class="tafel" role="dialog" aria-labelledby="dTitel">
    <h2 id="dTitel"></h2>
    <p id="dText"></p>
    <dl><dt>Preis</dt><dd id="dPreis"></dd><dt>Ab Stufe</dt><dd id="dStufe"></dd></dl>
    <div class="reihe"><button class="knopf" id="dZu">Zurück</button><button class="knopf" id="dKauf">Freischalten</button></div>
  </div>
</div>

  const vor=new Int32Array(W*H).fill(-1),q=[sy*W+sx];vor[sy*W+sx]=sy*W+sx;
  for(let i=0;i<q.length;i++){
    const c=q[i],x=c%W,y=(c-x)/W;
    if(x===zx&&y===zy){const p=[];let k=c;while(k!==sy*W+sx){p.push([k%W,(k-k%W)/W]);k=vor[k]}return p.reverse()}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,n=ny*W+nx;if(geht(nx,ny)&&vor[n]<0){vor[n]=c;q.push(n)}}
